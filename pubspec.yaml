name: wallet
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  flutter_localizations:
    sdk: flutter
  intl: any
  l10n_flutter: ^1.0.7
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  get_it: ^8.2.0
  flutter_bloc: ^9.1.1
  flutter_slidable: ^4.0.3
  flutter_screenutil: ^5.9.3
  go_router: ^17.0.0

dev_dependencies:
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
      - assets/images/